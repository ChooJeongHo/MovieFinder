name: Certificate Pin Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # 판정 기준은 OkHttp CertificatePinner와 같다: 서버가 보낸 체인(leaf/중간/루트) 중 하나라도
      # 코드에 선언된 핀과 일치하면 정상. leaf만 비교하면 Let's Encrypt 갱신 때마다 오탐이 난다.
      - name: Collect certificate chain pins
        run: |
          chain_pins() {
            echo | openssl s_client -connect "$1:443" -servername "$1" -showcerts 2>/dev/null |
              awk -v cmd="openssl x509 -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl enc -base64" '
                /BEGIN CERTIFICATE/ { buf = "" }
                { buf = buf $0 "\n" }
                /END CERTIFICATE/ { printf "%s", buf | cmd; close(cmd) }'
          }
          # openssl 실패가 pipefail로 이 줄에서 조용히 스크립트를 죽이지 않도록 || true, 실패 여부는 아래에서 파일이 비었는지로 판단한다
          chain_pins api.themoviedb.org > "$RUNNER_TEMP/api.chain" || true
          chain_pins image.tmdb.org > "$RUNNER_TEMP/image.chain" || true

          for host in api image; do
            if [ ! -s "$RUNNER_TEMP/$host.chain" ]; then
              # 체인을 못 가져온 것은 핀 불일치가 아니라 점검 불가 — 가짜 보안 이슈를 만들지 않고 실행을 실패시킨다
              echo "::error::$host 서버의 인증서 체인을 가져오지 못했습니다 (네트워크/openssl 오류). 핀 불일치가 아닙니다."
              exit 1
            fi
            echo "$host chain pins:"
            sed 's#^#  sha256/#' "$RUNNER_TEMP/$host.chain"
          done

      - name: Check api.themoviedb.org pins
        id: check-api
        run: |
          grep -E 'PIN_API_(LEAF|INTER) *=' app/src/main/java/com/choo/moviefinder/di/NetworkModule.kt \
            | grep -oE 'sha256/[A-Za-z0-9+/=]+' | sed 's#^sha256/##' > "$RUNNER_TEMP/api.declared"
          MATCHED=$(grep -Fxf "$RUNNER_TEMP/api.declared" "$RUNNER_TEMP/api.chain" || true)

          if [ -n "$MATCHED" ]; then
            echo "✅ api.themoviedb.org pin matches (체인에서 일치한 핀:)"
            echo "$MATCHED" | sed 's#^#  sha256/#'
            echo "api_status=ok" >> $GITHUB_OUTPUT
          else
            echo "❌ api.themoviedb.org pin MISMATCH! 체인의 어떤 인증서도 NetworkModule.kt의 PIN_API_*와 일치하지 않음"
            echo "api_status=mismatch" >> $GITHUB_OUTPUT
          fi

      - name: Check image.tmdb.org pins
        id: check-image
        run: |
          grep -E 'PIN_IMAGE_(LEAF|INTER) *=' app/src/main/java/com/choo/moviefinder/di/NetworkModule.kt \
            | grep -oE 'sha256/[A-Za-z0-9+/=]+' | sed 's#^sha256/##' > "$RUNNER_TEMP/image.declared"
          MATCHED=$(grep -Fxf "$RUNNER_TEMP/image.declared" "$RUNNER_TEMP/image.chain" || true)

          if [ -n "$MATCHED" ]; then
            echo "✅ image.tmdb.org pin matches (체인에서 일치한 핀:)"
            echo "$MATCHED" | sed 's#^#  sha256/#'
            echo "image_status=ok" >> $GITHUB_OUTPUT
          else
            echo "❌ image.tmdb.org pin MISMATCH! 체인의 어떤 인증서도 NetworkModule.kt의 PIN_IMAGE_*와 일치하지 않음"
            echo "image_status=mismatch" >> $GITHUB_OUTPUT
          fi

      - name: Check widget pins
        id: check-widget
        run: |
          grep -oE 'sha256/[A-Za-z0-9+/=]+' app/src/main/java/com/choo/moviefinder/presentation/widget/PopularMoviesRemoteViewsFactory.kt \
            | sed 's#^sha256/##' > "$RUNNER_TEMP/widget.declared"
          MATCHED=$(grep -Fxf "$RUNNER_TEMP/widget.declared" "$RUNNER_TEMP/api.chain" || true)

          if [ -n "$MATCHED" ]; then
            echo "✅ Widget pin matches (api 체인에서 일치한 핀:)"
            echo "$MATCHED" | sed 's#^#  sha256/#'
            echo "widget_status=ok" >> $GITHUB_OUTPUT
          else
            echo "❌ Widget pin MISMATCH! api 체인의 어떤 인증서도 위젯 파일의 핀과 일치하지 않음"
            echo "widget_status=mismatch" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on mismatch
        if: steps.check-api.outputs.api_status == 'mismatch' || steps.check-image.outputs.image_status == 'mismatch' || steps.check-widget.outputs.widget_status == 'mismatch'
        uses: actions/github-script@v7
        with:
          script: |
            const apiStatus = '${{ steps.check-api.outputs.api_status }}';
            const imageStatus = '${{ steps.check-image.outputs.image_status }}';
            const widgetStatus = '${{ steps.check-widget.outputs.widget_status }}';

            let body = '## Certificate Pin Mismatch Detected\n\n';
            body += '| Server | Status |\n|--------|--------|\n';
            body += `| api.themoviedb.org | ${apiStatus === 'ok' ? '✅ OK' : '❌ MISMATCH'} |\n`;
            body += `| image.tmdb.org | ${imageStatus === 'ok' ? '✅ OK' : '❌ MISMATCH'} |\n`;
            body += `| Widget (api) | ${widgetStatus === 'ok' ? '✅ OK' : '❌ MISMATCH'} |\n`;
            body += '\n### Action Required\n';
            body += 'Update certificate pins in `NetworkModule.kt` and/or `PopularMoviesRemoteViewsFactory.kt`.\n';
            body += 'See CLAUDE.md for the openssl command to get new pin hashes.\n';

            const { owner, repo } = context.repo;
            const title = '🔒 Certificate Pin Mismatch Detected';

            // 같은 제목의 열린 이슈가 있으면 새로 만들지 않는다 (매주 월요일 중복 생성 방지)
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(i => !i.pull_request && i.title === title);

            if (!existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['security', 'bug']
              });
              return;
            }

            // 상태 표가 그대로면 아무것도 하지 않는다.
            // 다른 서버가 새로 깨졌다면 열린 이슈에 묻히지 않도록 본문을 갱신하고 코멘트로 알린다.
            const normalize = s => (s || '').replace(/\r\n/g, '\n').trim();
            if (normalize(existing.body) === normalize(body)) {
              core.info(`Issue #${existing.number} is already open with the same status; skipping.`);
              return;
            }
            await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: '핀 상태가 변경되었습니다.\n\n' + body
            });

      - name: Summary
        run: |
          echo "## Certificate Pin Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Server | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| api.themoviedb.org | ${{ steps.check-api.outputs.api_status == 'ok' && '✅ OK' || '❌ MISMATCH' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| image.tmdb.org | ${{ steps.check-image.outputs.image_status == 'ok' && '✅ OK' || '❌ MISMATCH' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Widget | ${{ steps.check-widget.outputs.widget_status == 'ok' && '✅ OK' || '❌ MISMATCH' }} |" >> $GITHUB_STEP_SUMMARY
